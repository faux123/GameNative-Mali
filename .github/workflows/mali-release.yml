name: Mali release

# Builds directly installable, debug-signed APKs (modern + legacy) and
# publishes a GitHub prerelease on v*-mali* tags. No upstream keystore or
# analytics secrets required: the release buildType signs with the debug
# key and the secret() gradle helper defaults to empty strings.

on:
  push:
    tags:
      - "v*-mali*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK Build Tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --install "build-tools;34.0.0"

      - name: Build APKs
        run: ./gradlew :app:assembleModernRelease :app:assembleLegacyRelease

      - name: Stage APKs
        run: |
          cp app/build/outputs/apk/modern/release/app-modern-release.apk \
             gamenative-mali-modern.apk
          cp app/build/outputs/apk/legacy/release/app-legacy-release.apk \
             gamenative-mali-legacy.apk
          ls -la gamenative-mali-*.apk

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gamenative-mali-apks
          path: gamenative-mali-*.apk

      - name: Publish prerelease
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: |
            gamenative-mali-modern.apk
            gamenative-mali-legacy.apk
