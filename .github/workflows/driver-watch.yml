name: Driver watch

# Watches the component upstreams that feed the Mali graphics stack
# (wrapper, DXVK, Bannerlator's bundled builds, GameNative's adrenotools
# catalog) and opens an issue when any of them ship something new.
# The app repo itself is tracked separately by upstream-sync.yml.

on:
  schedule:
    - cron: "47 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare component upstreams against recorded state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          STATE=.github/driver-watch-state.json
          get() { gh api "$1" --jq "$2" 2>/dev/null || echo "none"; }

          WRAPPER=$(get repos/leegao/bionic-vulkan-wrapper/releases/latest .tag_name)
          WRAPPER_SHA=$(get repos/leegao/bionic-vulkan-wrapper/commits/master .sha | cut -c1-12)
          DXVK=$(get repos/doitsujin/dxvk/releases/latest .tag_name)
          BANNERLATOR=$(get repos/The412Banner/Bannerlator/releases/latest .tag_name)
          LANDING=$(get "repos/utkarshdalal/gamenative-landing-page/commits?path=data/manifest.json&per_page=1" '.[0].sha' | cut -c1-12)

          jq -n \
            --arg wrapper "$WRAPPER" --arg wrapper_sha "$WRAPPER_SHA" \
            --arg dxvk "$DXVK" --arg bannerlator "$BANNERLATOR" \
            --arg landing "$LANDING" \
            '{wrapper: $wrapper, wrapper_master: $wrapper_sha, dxvk: $dxvk, bannerlator: $bannerlator, landing_manifest: $landing}' > /tmp/new-state.json

          if [ -f "$STATE" ] && diff -q "$STATE" /tmp/new-state.json >/dev/null; then
            echo "No component changes."
            exit 0
          fi

          {
            echo "Component upstream changes detected on $(date -u +%F):"
            echo
            echo '```diff'
            diff -u "$STATE" /tmp/new-state.json 2>/dev/null || cat /tmp/new-state.json
            echo '```'
            echo
            echo "Sources: leegao/bionic-vulkan-wrapper (release + master), doitsujin/dxvk (release), The412Banner/Bannerlator (release), gamenative-landing-page data/manifest.json."
          } > /tmp/issue-body.md

          if [ -f "$STATE" ]; then
            gh issue create \
              --title "Driver watch: component upstream updates $(date -u +%F)" \
              --body-file /tmp/issue-body.md
          else
            echo "First run: recording baseline state, no issue."
          fi

          cp /tmp/new-state.json "$STATE"
          git config user.name "driver-watch[bot]"
          git config user.email "driver-watch@users.noreply.github.com"
          git add "$STATE"
          git commit -m "chore: driver-watch state $(date -u +%F)" || exit 0
          git push
